name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or commit to build. Defaults to the triggering commit.
        type: string
        default: ''
      push:
        description: Push the image to the registry. Set to false to only check that the image builds.
        type: boolean
        default: true
      runner:
        type: string
        default: ubuntu-latest
      fresh:
        description: Build without layer cache, to pick up patched base images and packages
        type: boolean
        default: false
      build-args:
        type: string
        default: ''
    outputs:
      image:
        description: Image reference, including digest when pushed
        value: ${{ jobs.build.outputs.image }}
      source-sha:
        description: Commit the image was built from
        value: ${{ jobs.build.outputs.source-sha }}

jobs:
  build:
    name: Build image
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    outputs:
      image: ${{ steps.build.outputs.image }}
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image
        id: build
        uses: nais/docker-build-push@588f76a6f45aeb1e75d5e8417ec6ef6d79b2b39f # v0
        with:
          team: team-researchops
          push_image: ${{ inputs.push }}
          pull: true
          no_cache: ${{ inputs.fresh }}
          build_args: |
            GIT_SHA=${{ steps.source.outputs.sha }}
            ${{ inputs.build-args }}
          build_secrets: |
            "NODE_AUTH_TOKEN=${{ github.token }}"
