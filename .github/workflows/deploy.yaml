name: Deploy

on:
  workflow_call:
    inputs:
      cluster:
        description: dev-gcp or prod-gcp. Also used as the GitHub environment name.
        type: string
        required: true
      manifest:
        type: string
        required: true
      ref:
        description: Commit to read the manifest from. Defaults to the triggering commit.
        type: string
        default: ''
      image:
        type: string
        required: true
      source-sha:
        description: Commit the image was built from. When set, a production deploy is tagged as a release.
        type: string
        default: ''

jobs:
  deploy:
    name: Deploy to ${{ inputs.cluster }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.cluster }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # Waits until the new pods are ready, and fails if the rollout does not succeed.
      - name: Deploy
        uses: nais/deploy/actions/deploy@427e29c94d911626a023a76f402f6dcae1f840b7 # v3
        env:
          CLUSTER: ${{ inputs.cluster }}
          RESOURCE: ${{ inputs.manifest }}
          VAR: image=${{ inputs.image }}

      # The newest release tag is the code in prod, and all release tags form the prod history.
      # Nightly refresh rebuilds the newest one and leaves out source-sha, so it does not add a tag.
      # Rollback redeploys the image in a tag.
      - name: Tag release
        if: inputs.cluster == 'prod-gcp' && inputs.source-sha != ''
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
          IMAGE: ${{ inputs.image }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin "$SOURCE_SHA"
          TAG="release-$(date -u +%Y%m%d-%H%M%S)"
          git tag -a "$TAG" "$SOURCE_SHA" -m "$IMAGE"
          git push origin "$TAG"
